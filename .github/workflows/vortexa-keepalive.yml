name: Vortexa Auto Keep-Alive

on:
  schedule:
    # 每 3 天执行一次 (UTC时间 08:00，北京时间 16:00)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动触发测试

jobs:
  run-keep-alive:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Run Keep-Alive Script
      env:
        VORTEXA_EMAIL: ${{ secrets.VORTEXA_EMAIL }}
        VORTEXA_PASSWORD: ${{ secrets.VORTEXA_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        python keepalive.py
